name: Refresh pricing data

# Re-fetches Oracle's live pricing API and refreshes the raw-product snapshot +
# metadata timestamps in src/data/pricing-data.json (curated category structures
# are preserved). Opens a PR when anything changed.
on:
  schedule:
    - cron: '23 7 1 * *' # 07:23 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh OCI pricing snapshot
        run: npm run generate-data
      - name: Verify it still builds and tests pass
        run: |
          npm run build
          npm test
      - name: Open a PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): monthly OCI pricing refresh'
          branch: automated/pricing-refresh
          delete-branch: true
          title: 'chore(data): monthly OCI pricing refresh'
          body: |
            Automated monthly refresh of the OCI pricing snapshot from Oracle's live API.
            Review the diff to confirm the numbers look sane before merging.
          add-paths: |
            src/data/pricing-data.json
